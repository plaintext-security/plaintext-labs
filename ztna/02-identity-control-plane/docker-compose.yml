# Module 02 — Identity as the Control Plane
# Keycloak 24.x with the Corp realm pre-loaded from data/corp-realm.json.
# Access the admin console at http://localhost:8080/admin (admin / admin).
# The Corp realm is at http://localhost:8080/realms/corp.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    # Keycloak's dev-mode H2 database calls InetAddress.getLocalHost() while
    # taking its file lock, so the container must be able to resolve its own
    # hostname. Docker normally writes that into /etc/hosts, but a transient
    # resolver hiccup at boot makes getLocalHost() throw
    # UnknownHostException -> "Failed to obtain JDBC connection" and Keycloak
    # exits. Pin a stable hostname and hard-map it to loopback so self-
    # resolution can never depend on Docker populating /etc/hosts in time.
    hostname: keycloak
    extra_hosts:
      - "keycloak:127.0.0.1"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./data/corp-realm.json:/opt/keycloak/data/import/corp-realm.json:ro
    ports:
      - "8080:8080"
    # The Keycloak image ships no curl/wget, so probe the realm endpoint with
    # bash's built-in /dev/tcp and assert HTTP 200 on /realms/corp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/corp HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  # The Authorization Code callback app (Step 3). It comes up with the realm so
  # http://localhost:3000 is ready as soon as `make up` finishes — no separate
  # command. Stdlib-only Python, so it runs straight from the slim image with the
  # source mounted read-only; no build step, no dependencies. The app never calls
  # Keycloak server-side — it only builds the browser redirect URL and shows you
  # the exchange curl — so it needs nothing but its own published port.
  webapp:
    image: python:3.12-slim
    command: ["python", "/app/app.py"]
    volumes:
      - ./webapp:/app:ro
    ports:
      - "3000:3000"
    depends_on:
      - keycloak
