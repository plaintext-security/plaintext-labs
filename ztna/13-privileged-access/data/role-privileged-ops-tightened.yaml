# privileged-ops, AFTER Step 5's tightening — least privilege for the fleet
# this lab actually has: the one login the job needs (not root), the one
# environment it needs (not every host in the cluster). Apply with:
#   make tighten
# (which runs `tctl create -f ... --force` to update the existing role).
kind: role
version: v7
metadata:
  name: privileged-ops
spec:
  allow:
    logins: ["ubuntu"]
    node_labels:
      env: ["production"]
    # Least privilege narrows logins and nodes, but the operator still needs to
    # replay their own sessions — keep the recording read rule.
    rules:
      - resources: ["session"]
        verbs: ["list", "read"]
  options:
    max_session_ttl: 15m
