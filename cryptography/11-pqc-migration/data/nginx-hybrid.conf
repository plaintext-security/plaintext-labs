# MIGRATED config — the AFTER state. Identical to the classical baseline EXCEPT
# the key-exchange group list: X25519MLKEM768 is ADDED IN FRONT of the retained
# classical groups. This is the strangler-fig, additive migration:
#
#   * a MODERN client that offers ML-KEM negotiates the hybrid (quantum-safe)
#     group X25519MLKEM768;
#   * a LEGACY client that cannot offer ML-KEM falls back to classical X25519 —
#     TLS group negotiation routes each client to the best path it supports.
#
# The classical groups are NEVER removed — that is what preserves interop and
# makes rollback cheap. Setting this list to ONLY X25519MLKEM768 is the
# "big-bang" trap: it breaks every legacy client. We do not do that.
#
# Requires nginx linked against OpenSSL >= 3.5 (ships ML-KEM natively).
server {
    listen 443 ssl;
    server_name pqc-server;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Hybrid PQC group ADDED in front; classical groups retained behind it.
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;

    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    location / {
        default_type text/plain;
        return 200 "pqc-migration lab: TLS up (hybrid X25519MLKEM768 offered, classical retained)\n";
    }
}
