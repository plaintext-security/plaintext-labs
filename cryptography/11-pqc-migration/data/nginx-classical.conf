# CLASSICAL baseline — the brownfield config every web service ships today.
# TLS 1.2/1.3, ECDHE key exchange (classical groups only), RSA certificate.
# NO post-quantum anything. This is the BEFORE state of the migration.
server {
    listen 443 ssl;
    server_name pqc-server;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Classical key-exchange groups ONLY — no ML-KEM. nginx maps ssl_ecdh_curve
    # to OpenSSL's supported-groups list for TLS 1.3 key exchange.
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    location / {
        default_type text/plain;
        return 200 "pqc-migration lab: TLS up (classical baseline)\n";
    }
}
