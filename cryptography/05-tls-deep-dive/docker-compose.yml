# Module 05 — TLS Deep Dive
# nginx (weak + strong config) + testssl.sh scanner
services:
  nginx:
    image: nginx:1.27.0-alpine
    container_name: tls-nginx
    volumes:
      - ./data/nginx-weak.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/gen-cert.sh:/gen-cert.sh:ro
    # Install openssl (not in nginx:alpine), generate the self-signed cert, then hand off
    # to the stock nginx entrypoint. Run the script with `sh` explicitly so it does not
    # depend on the bind-mount exec bit (Docker Desktop on macOS does not preserve it).
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl >/dev/null && sh /gen-cert.sh && exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    ports:
      - "8443:443"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 5

  lab:
    build: .
    image: plaintext/tls-deep-dive:1.0
    container_name: tls-lab
    working_dir: /lab
    volumes:
      - ./:/lab
    depends_on:
      nginx:
        condition: service_healthy
    command: sleep infinity
