# Module 10 — Auditing Applied-Crypto Failures
# Three nginx instances with different TLS configurations + testssl.sh scanner
services:
  nginx-legacy:
    image: nginx:1.27.0-alpine
    container_name: tls-legacy
    volumes:
      - ./data/nginx-legacy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/gen-certs.sh:/gen-certs.sh:ro
    # Install openssl (absent in nginx:alpine), generate the cert, then hand off to the
    # stock entrypoint. Run via `sh` so it doesn't rely on the bind-mount exec bit
    # (Docker Desktop on macOS does not preserve it).
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl >/dev/null && sh /gen-certs.sh && exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx-modern:
    image: nginx:1.27.0-alpine
    container_name: tls-modern
    volumes:
      - ./data/nginx-modern.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/gen-certs.sh:/gen-certs.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl >/dev/null && sh /gen-certs.sh && exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx-strong:
    image: nginx:1.27.0-alpine
    container_name: tls-strong
    volumes:
      - ./data/nginx-strong.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/gen-certs.sh:/gen-certs.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl >/dev/null && sh /gen-certs.sh && exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 5

  lab:
    build: .
    image: plaintext/crypto-audit:1.0
    container_name: crypto-audit-lab
    working_dir: /lab
    volumes:
      - ./:/lab
    depends_on:
      nginx-legacy:
        condition: service_healthy
      nginx-modern:
        condition: service_healthy
      nginx-strong:
        condition: service_healthy
    command: sleep infinity
