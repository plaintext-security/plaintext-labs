# One-command lab environment for Module 19 — Reviewing AI Detections.
# `make up` builds it; `make shell` drops you in; `make demo` runs the worked example.
services:
  lab:
    build: .
    image: plaintext/reviewing-ai-detections
    working_dir: /lab
    # Mount the module dir so the fixes you write on the host are immediately
    # visible in the container.
    volumes:
      - ./:/lab
    # Keep it alive for `make shell` / interactive work.
    command: sleep infinity
