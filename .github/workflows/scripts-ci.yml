name: Scripts CI

# Tests for the shared maintainer/lab tooling under scripts/ (offline, no Docker/network).
# Runs on PRs and pushes to main that touch the scripts.

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-ci.yml"

permissions:
  contents: read

concurrency:
  group: scripts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - name: Install dev deps
        run: python3 -m pip install -r scripts/requirements-dev.txt
      - name: Run pytest suite
        run: python3 -m pytest scripts/tests/ -q
