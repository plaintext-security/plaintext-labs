name: Scripts CI

# Tests for the shared maintainer/lab tooling under scripts/ (offline, no Docker/network).
# Runs on PRs and pushes to main that touch the scripts.

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-ci.yml"

permissions:
  contents: read

concurrency:
  group: scripts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: { python-version: "3.12" }
      - name: Install dev deps
        run: python3 -m pip install -r scripts/requirements-dev.txt
      - name: Run pytest suite
        run: python3 -m pytest scripts/tests/ -q
