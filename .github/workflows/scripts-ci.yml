name: Scripts CI

# Tests for the shared maintainer/lab tooling under scripts/ (offline, no Docker/network).
# Runs on PRs and pushes to main that touch the scripts.

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-ci.yml"

permissions:
  contents: read

concurrency:
  group: scripts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: "3.12" }
      - name: Install dev deps
        run: python3 -m pip install -r scripts/requirements-dev.txt
      - name: Run pytest suite
        run: python3 -m pytest scripts/tests/ -q
