services:
  server:
    build: .
    image: plaintext/velociraptor:0.77.1
    container_name: velo-server
    command: >
      sh -c "
        if [ ! -f /config/server.config.yaml ]; then
          velociraptor config generate --merge '{\"Client\":{\"server_urls\":[\"https://server:8000/\"],\"use_self_signed_ssl\":true},\"GUI\":{\"bind_address\":\"0.0.0.0\",\"bind_port\":8889,\"use_plain_http\":true},\"Frontend\":{\"bind_address\":\"0.0.0.0\",\"bind_port\":8000}}' > /config/server.config.yaml &&
          velociraptor --config /config/server.config.yaml config client > /config/client.config.yaml &&
          velociraptor --config /config/server.config.yaml user add admin admin --role administrator;
        fi &&
        velociraptor --config /config/server.config.yaml frontend -v
      "
    volumes:
      - velo-config:/config
      - velo-data:/velociraptor
    ports:
      - "8889:8889"
      - "8000:8000"
    networks:
      - velo-net
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /config/client.config.yaml"]
      interval: 5s
      timeout: 5s
      retries: 20

  agent:
    image: plaintext/velociraptor:0.77.1
    container_name: velo-agent
    depends_on:
      server:
        condition: service_healthy
    command: >
      sh -c "
        sleep 3 &&
        velociraptor --config /config/client.config.yaml client -v
      "
    volumes:
      - velo-config:/config
    networks:
      - velo-net

  lab:
    image: plaintext/velociraptor:0.77.1
    container_name: velo-lab
    depends_on:
      - server
      - agent
    volumes:
      - velo-config:/config
      - ./data:/data
      - ./scripts:/scripts
    networks:
      - velo-net
    entrypoint: ["sh", "-c", "sleep infinity"]

volumes:
  velo-config:
  velo-data:

networks:
  velo-net:
    driver: bridge
