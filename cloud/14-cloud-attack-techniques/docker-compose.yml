# Lab 14 — Cloud Attack Techniques
# Two services: floci (free local AWS emulator) and the lab container with attack tools.
services:
  floci:
    image: floci/floci:1.5.34   # MIT-licensed LocalStack replacement; same :4566 endpoint
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  lab:
    build: .
    image: plaintext/cloud-attack-techniques
    working_dir: /lab
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
      - AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      - AWS_ENDPOINT_URL=http://floci:4566
    volumes:
      - ./:/lab
    command: sleep infinity
