# Module 09 — Serverless Security
# floci (Lambda + IAM + S3) + lab container (SAM CLI + cloudfox).
services:
  floci:
    image: floci/floci:1.5.34   # MIT-licensed LocalStack replacement; same :4566 endpoint
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - "4566:4566"
    volumes:
      # floci runs each Lambda in its own runtime container via the host Docker socket.
      # Without this mount, `lambda invoke` cannot start the function container.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  lab:
    build: .
    image: plaintext/serverless-security:1.0
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://floci:4566
    working_dir: /lab
    volumes:
      - ./:/lab
    depends_on:
      floci:
        condition: service_healthy
    command: sleep infinity
