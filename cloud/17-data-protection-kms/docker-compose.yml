# Module 17 — Data Protection & KMS
# Services: floci (free local AWS emulator — KMS/IAM/STS/S3) + lab container (aws cli + openssl).
# `make up` creates a KMS key; `make demo` walks envelope encryption + key-policy verify.
# The lab drives plain `aws` via AWS_ENDPOINT_URL, so it stays one variable away from real AWS.
services:
  floci:
    image: floci/floci:1.5.34   # MIT-licensed LocalStack replacement; same :4566 endpoint
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  seed:
    build: .
    image: plaintext/data-protection-kms
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./:/lab
    command: bash /lab/data/setup.sh
    restart: "no"

  lab:
    build: .
    image: plaintext/data-protection-kms
    depends_on:
      - seed
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    working_dir: /lab
    volumes:
      - ./:/lab
    command: sleep infinity
