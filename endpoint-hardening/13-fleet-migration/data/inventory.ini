# Module 13 — fleet inventory grouped into rings.
# 6 in-service hosts. Rings are least-risky-first: test -> canary -> fleet.
# host-05 is in the legacy-app group: the full baseline breaks its app, forcing
# the defended-exception decision.

[test]
host-01   # staging box — non-critical, the one you can lose

[canary]
host-02   # small production slice
host-05   # LEGACY app server — breaks under the full baseline (the exception)

[fleet]
host-03   # production app server
host-04   # production app server
host-06   # production app server

# The legacy group carries a relaxed profile via group_vars/legacy-app.yml.
[legacy-app]
host-05

# Convenience group: every host in the fleet.
[all_hosts:children]
test
canary
fleet
