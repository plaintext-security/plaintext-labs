title: LSASS Memory Access via Sysmon ProcessAccess
id: a3b4c5d6-e7f8-9012-bcde-f01234567890
status: experimental
description: >
  Detects a process opening a handle to lsass.exe with high access rights — the
  signature of credential dumping (e.g. mimikatz sekurlsa::logonpasswords).
  Matches the real EVTX-ATTACK-SAMPLES credential-access sample staged by
  `make convert` (Sysmon Event ID 10 against lsass.exe).
author: Platform Security
date: 2026/06/01
references:
  - https://attack.mitre.org/techniques/T1003/001/
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: '10'
    TargetImage: 'lsass.exe'
  condition: selection
fields:
  - SourceImage
  - TargetImage
  - GrantedAccess
falsepositives:
  - Legitimate security products (EDR/AV) that read LSASS memory
  - Some backup or diagnostic tooling
level: high
