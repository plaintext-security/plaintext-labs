services:
  # Real intentionally-vulnerable target: Apache Solr 8.11.0, the Vulhub
  # Log4Shell (CVE-2021-44228) reference image. Exposes 8983 (HTTP / Solr
  # admin, real Jetty/Solr banners) and 5005 (JDWP debug). Genuine service,
  # genuine banners — not a hand-rolled echo server.
  # https://github.com/vulhub/vulhub/tree/master/log4j/CVE-2021-44228
  target:
    image: vulhub/solr:8.11.0
    networks:
      - lab-net

  lab:
    build: .
    image: plaintext/python-network:1.0
    working_dir: /lab
    volumes:
      - ./:/lab
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - lab-net
    command: sleep infinity

networks:
  lab-net:
    driver: bridge
