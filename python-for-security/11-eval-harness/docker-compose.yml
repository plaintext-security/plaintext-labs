# One-command lab environment for Module 11 — Eval Harness.
# `make up` builds it; `make shell` drops you in; `make demo` runs the worked example.
services:
  lab:
    build: .
    image: plaintext/eval-harness:1.0
    working_dir: /lab
    # Mount the module dir so the corpus, labels and eval.py you edit on the host
    # are immediately visible in the container.
    volumes:
      - ./:/lab
    command: sleep infinity
